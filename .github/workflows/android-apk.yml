name: QatanCraft Survival Installable APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'games/voxelibre/**'
      - 'builtin/**'
      - 'client/**'
      - 'lib/**'
      - 'src/**'
      - 'irr/**'
      - 'textures/**'
      - 'fonts/**'
      - 'po/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installable-apk:
    name: Build QatanCraft Survival universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out QatanCraft
        uses: actions/checkout@v4

      - name: Install translation build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Build signed universal APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify installable package and native ABIs
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.qatancraft.survival'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/libqatancraft.so'
          unzip -l "$APK" | grep -F 'assets/games/voxelibre/game.conf'
          cp "$APK" QatanCraft-Survival-universal.apk
          sha256sum QatanCraft-Survival-universal.apk

      - name: Upload one installable APK to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: qatan-survival-${{ github.run_id }}
        run: |
          gh release create "$RELEASE_TAG" QatanCraft-Survival-universal.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "QatanCraft Survival — installable universal APK $GITHUB_RUN_NUMBER" \
            --notes "نسخة اختبار قابلة للتثبيت من QatanCraft Survival. تحتوي اللعبة ومحتوى VoxeLibre، وتستخدم حزمة Android جديدة: com.qatancraft.survival."
