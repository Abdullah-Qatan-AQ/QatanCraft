name: QatanCraft Android APK

on:
  push:
    branches: [main]
    paths:
      - 'misc/android/**'
      - 'src/**'
      - 'third_party/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out QatanCraft
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Build QatanCraft APK
        working-directory: misc/android
        env:
          ANDROID_NDK_VERSION: 26.3.11579264
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: test -s misc/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: misc/android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_TAG: qatan-build-${{ github.run_id }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "QatanCraft Android APK — draft build $GITHUB_RUN_NUMBER" \
              --notes "مسودة APK مبنية تلقائيًا من commit $GITHUB_SHA."
          fi
