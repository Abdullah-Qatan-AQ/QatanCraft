name: QatanCraft Android APK

on:
  push:
    branches: [main]
    paths:
      - 'misc/android/**'
      - 'src/**'
      - 'third_party/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out QatanCraft
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Build QatanCraft APK
        working-directory: misc/android
        env:
          ANDROID_NDK_VERSION: 26.3.11579264
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload QatanCraft APK
        uses: actions/upload-artifact@v4
        with:
          name: QatanCraft-debug-apk
          path: misc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
