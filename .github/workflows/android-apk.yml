name: QatanCraft Survival Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'games/voxelibre/**'
      - 'builtin/**'
      - 'client/**'
      - 'lib/**'
      - 'src/**'
      - 'irr/**'
      - 'textures/**'
      - 'fonts/**'
      - 'po/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build QatanCraft Survival APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out QatanCraft
        uses: actions/checkout@v4

      - name: Install translation build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Build QatanCraft Survival APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -n "$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%f %s bytes\n'

      - name: Upload APKs to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: qatan-survival-${{ github.run_id }}
        run: |
          mapfile -t APKS < <(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for apk in "${APKS[@]}"; do
              gh release upload "$RELEASE_TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
            done
          else
            gh release create "$RELEASE_TAG" "${APKS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "QatanCraft Survival Android — draft build $GITHUB_RUN_NUMBER" \
              --notes "مسودة QatanCraft Survival مبنية بمحرك Luanti ومحتوى VoxeLibre المفتوح من commit $GITHUB_SHA."
          fi
